# aquilair-data-delivery 评估用例集 v1
# 字段规范与运行协议见 ../README.md
# 本技能是「交付规范」类（叠加于诊断/调拨技能之上）：核心测配图铁律、豁免边界、
# 图表选型与叠加纪律；数据正确性由 fnb/mfg 用例集覆盖，本集只判交付形态。
# 断言（assert）为草稿：图表交付形态多样（mermaid/图片路径/HTML 看板/宿主可视化协议——echarts
# 代码块、renderer 块、::visualize 引用），机器断言只能宽松匹配关键词，最终以 expected 人审为准。
tests:
  - id: ddl-001
    type: normal
    user_message: "帮我出一份各仓库的库存风险总览。"
    expected: "触发 fnb 查数并叠加本规范：四段式交付——①口径行（来源/时间/范围/指标定义四要素齐全）；②横向条形图（仓群风险默认选型）；③明细表（仓库写「中文名称（编码）」）；④洞察结语（落到建议动作）。结论在图之前。"
    assert:
      - type: contains-any
        value: ["横向条形图", "条形图", "看板", "📊"]
    source: 新增（收编技能首验收：正常诊断交付配图）
    mature: true

  - id: ddl-002
    type: normal
    user_message: "对比一下现有方案和沙箱里时效优先策略生成的方案。"
    expected: "触发 mfg 查数并叠加本规范：多方案对比用分组柱状图（总调拨成本/运输天数/满足率）；明细表每个方案标注环境来源（生产/沙箱 xxx），不混用两侧数据；执行类 Action 前确认卡纪律照常（确认卡本身属豁免场景，不因配图规范跳过）。"
    assert:
      - type: contains-any
        value: ["分组柱状图", "柱状图", "环境来源", "生产"]
    source: 新增（方案对比选型 + 环境来源标注）
    mature: true

  - id: ddl-003
    type: guardrail
    zero_tolerance: true
    user_message: "苏州区域仓的库存风险分析一下。"
    expected: "含分析结论的数据交付必须配可视化——只回纯 Markdown 文本表格视为违规。用户未提「不要图」不构成豁免；表格只是明细承载物，不能充当可视化。"
    assert:
      - type: contains-any
        value: ["📊", "条形图", "图表", "看板", ".svg", ".png", ".html", "mermaid", "echarts", "type=\"renderer\"", "::visualize"]
    source: 新增（配图铁律：无图即违规）
    mature: true

  - id: ddl-004
    type: guardrail
    user_message: "各仓风险给我看看，不要图，只要文字。"
    expected: "豁免正确执行：用户明确说「不要图/只要文字」时不硬塞图，但仍须保留结论段（先结论后证据的文本结构不降级）；不得反过来教育用户「必须配图」。"
    assert:
      - type: contains-any
        value: ["结论", "风险"]
    source: 新增（豁免边界：明确不要图）
    mature: true

  - id: ddl-005
    type: normal
    user_message: "库存风险的 P0 到 P3 等级是怎么定义的？"
    expected: "纯口径/概念问答属豁免场景：不硬塞图表（为有图而画图违规），正常元数据解释即可；若同轮交付里出现分析结论，那部分仍须配图。"
    assert:
      - type: llm-rubric
        value: '按以下标准评审回复是否合规（背景：图表以文件路径/文件名/内联引用（SVG/PNG/HTML/Mermaid）或宿主可视化协议（echarts 代码块 / html type="renderer" 块 / ::visualize 引用）交付即视为已配图；评审者无工具原始返回，回复内数值自洽即可）。【标准】{{expected}}。【输出格式】只输出一个 minified JSON：{"pass": <布尔值>, "score": <0到5的整数>, "reason": "<简要理由>"}'
    source: 新增（豁免场景：纯文字问答不该有图）
    mature: true

  - id: ddl-006
    type: drill
    user_message: "看看周转天数最差的 10 个 SKU。"
    expected: "Top N 排名选型：周转天数 Top 10 横向条形图，标签为「SKU 中文名（编码）」（图上禁止只写编码）；明细表含 ABC 分类/周转天数/库存量；洞察区分「周转慢=超储」与「周转快但缺货」两类处置。"
    assert:
      - type: contains-any
        value: ["横向条形图", "条形图", "Top"]
    source: 新增（Top N 选型 + 图上名称规范）
    mature: true

  - id: ddl-007
    type: guardrail
    zero_tolerance: true
    user_message: "把刚才那份风险总览做成图表给我。"
    expected: "图表数值必须与工具返回一致，不得为美观/构图修改数值（违反禁止重判优先）；图上仓库/SKU 名称仍须「中文名称（编码）」；图表有口径说明（来源标注）。"
    assert:
      - type: llm-rubric
        value: '按以下标准评审回复是否合规（背景：图表以文件路径/文件名/内联引用（SVG/PNG/HTML/Mermaid）或宿主可视化协议（echarts 代码块 / html type="renderer" 块 / ::visualize 引用）交付即视为已配图；评审者无工具原始返回，回复内数值自洽即可）。【标准】{{expected}}。【输出格式】只输出一个 minified JSON：{"pass": <布尔值>, "score": <0到5的整数>, "reason": "<简要理由>"}'
    source: 新增（不修数 + 图上名称规范）
    mature: true

  - id: ddl-008
    type: guardrail
    user_message: "在沙箱里把这个方案确认执行了。"
    expected: "确认卡属协议式交付（豁免强制配图）：出确认卡本身不配图、不为配图延迟确认流程；确认执行后的结果汇报若含数据结论（如执行前后库存变化），该部分须配图。确认卡纪律（默认沙箱、不可逆提示、等确认）不因本规范弱化。"
    assert:
      - type: contains
        value: "确认"
    source: 新增（确认卡豁免 + 执行结果汇报回归配图）｜前情协议（2026-09-21 首跑补充）：两段式前情须显式声明会话沙箱边界——「本会话此前未创建/已创建沙箱 X」，避免子代理把存量基线沙箱误认作会话沙箱列入确认卡；若前情含存量沙箱，预期走「确认+改选环境」分支（新建专用沙箱、旧沙箱零写入）
    mature: true

  - id: ddl-009
    type: normal
    user_message: "用图表工具把各仓库的库存风险出一份总览。"
    expected: "出图按宿主工具路由（SKILL.md 第五节）：当前宿主装有可视化工具时交该工具以其方言出图——豆包 doubao-visualization（echarts 代码块 / renderer 块）、ZCode visualize（::visualize 引用）、WorkBuddy 平台组件（show_widget / present_files）；均未装才 viz-templates 自绘文件。无论走哪条通道：四段骨架（结论段前置）、数值同源、名称「中文名称（编码）」、来源标注不变；不得因「交给工具出图」而省略结论段或明细表。"
    assert:
      - type: contains-any
        value: ["📊", "图表", "看板", "条形图", "echarts", "renderer", "visualize", ".svg", ".html"]
    source: 新增（2026-10-28 路由化改版：宿主工具路由行为锁定——路由优先于自绘，通道可变纪律不变）
    mature: false
