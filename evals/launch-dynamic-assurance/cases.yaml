# 字段说明（validate_cases.py 兼容）：
#   follow_up —— 追问/施压第二轮消息；fixture —— 合成夹具（离线行为验收前提，不作线上事实）；
#   stage / expected_loaded —— 同 v1 语义（空态期断言灌入前行为，expected_loaded 断灌入后行为）。
# 状态：35 条 = 17 mature（lda-001~013 于 2026-11-03 P6 转正+口径跟随；lda-014~017 于 2026-11-09 授权转正）+ 18 草稿。

tests:
  # ============ 正常题（normal） ============

  - id: lda-001
    type: normal
    user_message: "这个上市项目里都建了哪些实体？顺便说说规则和动作是个什么情况"
    expected: "实体/规则/动作三类清单均以实时元数据（metadata_list_object_types / metadata_list_rules / metadata_list_actions）为来源回答并注明，不引记忆值或快照；引用规则时【待处理】规则逐条注明「待处理」；动作可用性与算法清单如实交代能力边界——动作可用与否以当前定义核实，不可用的动作如实说明，被要求执行时不承诺（创建/修改类请求转 launch-assurance-actions）；不引用任何演示实例数据充当清单内容。"
    assert:
      - type: contains-any
        value: ["实体", "规则"]
    stage: "空态期+数据灌入后"
    source: SKILL.md 0.4.0「接入与证据」+「按需参考·facts」；references/facts.md「工具行为」节；【口径跟随 2026-11-10：动作能力边界改「以当前定义核实」】
    mature: true

  - id: lda-002
    type: normal
    user_message: "上市事项那个实体都有什么字段？关键的说几个就行"
    expected: "识别「上市事项」= DishLaunchItem 并说明映射依据；属性级详情以 metadata_object_neighborhood（或 metadata_workspace_model）实时返回为准，逐个引用属性实名（如 item_type / execution_status / pre_item_codes / plan_completion_time / latest_actual_completion_time，以实时元数据为准不臆造，不引用已不存在的旧字段 max_plan_completion_time）；涉业务口径时按 business-semantics 解释并注明出处（plan_completion_time 的单次/周期含义须核对当前规则）；文档划线但系统仍在的字段不因划线断言不存在（元数据为实）。"
    assert:
      - type: contains-any
        value: ["item_type", "execution_status", "字段"]
    stage: "空态期+数据灌入后"
    source: SKILL.md 0.4.0「接入与证据」+ references/business-semantics.md「日期与就绪」；references/facts.md「元数据缺陷」表（TK-划线）；【口径跟随 2026-11-10：V8 基线字段改名 plan_completion_time，旧字段已不存在】
    mature: true

  - id: lda-003
    type: normal
    user_message: "SupplyDemandAllocation 这个实体跟哪些实体有关系？"
    expected: "关系清单以 metadata_workspace_model 的 relations 实时返回为权威并注明来源；不以 rel_ 生成名冒充关系实名；轻量看各关系挂载量可用 objects_relation_counts（2026-11-03 傍晚已打通、11-09 复验，语法用 relationCode 键，方言见 facts.md），重关系语义仍以元数据 relations / objects_links / 关联冗余字段（demand_nr 等）口径回答；关系两端实体与方向交代清楚。"
    assert:
      - type: contains-any
        value: ["关系", "关联"]
    stage: "空态期+数据灌入后"
    source: SKILL.md 0.4.0「探查循环·子图锚定」；references/facts.md「工具行为」节（relation_counts 已打通）；【口径跟随 2026-11-10：随 facts.md 现行口径废除「42200 待核查、不用 relation_counts」旧断言】
    mature: true

  - id: lda-004
    type: normal
    user_message: "现在系统里的新品上市计划是啥情况？帮我看看"
    expected: "先探实例规模（objects_query 带 include_total_count=true）再作答；空态如实报告「数据未灌入」，并交代这是查询结论而非猜测；禁止用 NP009 文档演示值（300000 杯 / 300 家 / T=2026-11-15）冒充查询结果；说明数据灌入后可答内容与查询路径（计划卡：编码/名称/新品/上市日/门店数/首月目标/状态，来源 DishLaunchPlan）。"
    expected_loaded: "真实查询 DishLaunchPlan 返回 NP009 实例后，按【计划概览】路径组织计划卡回答：plan_id / plan_name / dish_id / plan_launch_date / target_store_count / target_first_month_sales_qty / plan_status 逐字段引用查询返回值（plan_status 展示原值不解读枚举）；关键数值以查询返回为准且应与演示设定锚点一致（计划 NP009 / 青提冰茶 / 菜品编码 926001 / 计划上市日 2026-11-15 / 首月经营目标 300000 杯 / 目标首发门店 300 家）——不一致时如实报告差异不圆场；本问法锚定 DishLaunchPlan 单对象子图，普通查数直接文字作答（图比文字更清楚才配图，判据参照子图），纯 Markdown 表格计划卡交付合法，探查不越过该对象的关系邻居（不展开物料/分配/订单全链）。"
    assert:
      - type: contains-any
        value: ["数据未灌入", "未灌入", "0 实例", "没有数据"]
    stage: "空态期+数据灌入后"
    source: SKILL.md 0.4.0「探查循环」+「输出」；references/storyline-playbook.md「计划概览与口径」意图类；【口径跟随 2026-11-10：expected_loaded 配图口径随新基线措辞，断言强度不变（单对象纯文本合法）】
    mature: true

  - id: lda-005
    type: normal
    user_message: "物料缺口现在什么情况？有没有缺的"
    expected: "沿口径链路规划查询（ForecastSalesDemand 锁预测版本 → MaterialDemand 净需求 → MaterialKitting 齐套 → SupplyDemandAllocation 供需分配）并先探规模；空态如实报告「数据未灌入」；不编造缺口数值、不用演示值、空态不出假图表；说明灌入后的回答形态（按【物料×仓库×需求】粒度的齐套矩阵，缺口明细可追溯需求编号）；净需求 net_demand_qty 靠规则回写，届时引用回写值注明「计算回写」不自行计算。"
    expected_loaded: "沿口径链路（ForecastSalesDemand 锁本计划预测版本 → MaterialDemand → MaterialKitting → SupplyDemandAllocation）真实查询返回实例后，按【物料×仓库×需求】粒度组织齐套与缺口回答，缺口明细可追溯需求编号；净需求 net_demand_qty 引用规则回写值并注明「计算回写」，不自行计算；缺口数值以实时查询为准并与演示设定锚点链路（计划 NP009 / 菜品编码 926001）一致性核对，不一致时如实报告差异不圆场；缺口矩阵属跨对象多实体联动分析（图比文字更清楚，判据参照子图），配可视化交付（形态按 aquilair-data-delivery）。"
    assert:
      - type: contains-any
        value: ["物料", "缺口"]
    stage: "空态期+数据灌入后"
    source: SKILL.md 0.4.0「计算与不确定性」+ references/mrp-playbook.md「供需匹配与净需求」；【口径跟随 2026-11-10：链路补 MaterialKitting（V8 基线齐套承载）】
    mature: true

  - id: lda-006
    type: normal
    user_message: "现在上市这块有什么风险没有？"
    expected: "优先查询该计划的 LaunchRisk 风险记录（V8 基线实体已存在）并按 source_instance_id 结合 risk_type 核对来源事项/需求/订单；查不到风险记录不证明无异常——再沿事项状态（DishLaunchItem.execution_status）、物料缺口（MaterialDemand.net_demand_qty）、订单异常（PurchaseOrder 逾期/延期字段）补充探查，本次查询识别出的异常与已登记风险分开列；空态如实报告「数据未灌入」并给出灌入后的风险表达路径；不虚构风险条目，不把故事线演示编码当系统事实引用。"
    assert:
      - type: contains-any
        value: ["风险", "事项"]
    stage: "空态期+数据灌入后"
    source: SKILL.md 0.4.0「输出」；references/launch-assurance.md「上市风险通知」；references/business-semantics.md「上市风险」；【口径跟随 2026-11-10：LaunchRisk 实体已存在（V8 新增承载），废除旧「无独立风险实体」表述；stage 随之扩为两阶段】
    mature: true

  # ============ 追问题（drill） ============

  - id: lda-007
    type: drill
    user_message: "这项目里都建了哪些实体？"
    follow_up: "SupplyDemandAllocation 展开说说，都有哪些属性？判定口径是什么？"
    expected: "第二轮答复：会话内复用第一轮已确认的模型信息（SupplyDemandAllocation 在实体清单内，不重复追问实体是否存在）；属性逐个引用实时元数据实名（allocation_nr / supply_type / supply_nr / supply_available_date / supply_available_qty / allocated_qty / allocation_status 等，以元数据为准不臆造）；判定口径引 business-semantics 业务语义：supply_type 枚举 INVENTORY（仓库库存）/PURCHASE_IN_TRANSIT（采购在途）、allocation_status 枚举 PLANNED/CONFIRMED/CANCELLED，注明枚举出自业务文档（enumValues 全空）；业务需求要求把已确认未下发计划纳入有效供应，当前实现未体现时如实说明，不发明新枚举；到货可行性判定字段 expected_supply_qty_ontime / expected_gap_qty 系统缺失（文档有公式），涉及时说明改由 supply_available_date 与需求日期现算对比并注明字段缺失。"
    assert:
      - type: contains-any
        value: ["supply_type", "allocation_status", "属性"]
    stage: "空态期+数据灌入后"
    source: SKILL.md 0.4.0「接入与证据」+ references/business-semantics.md「决策枚举」；references/facts.md「元数据缺陷」表（TK-sda字段）；【口径跟随 2026-11-10：补第三类供应实现待验证口径；domain-model 引用随退役改 business-semantics】
    mature: true

  - id: lda-008
    type: drill
    user_message: "现在的上市计划给我看看"
    follow_up: "那它的物料需求呢？"
    expected: "第二轮答复：会话内复用第一轮的提问上下文，不重复追问「哪个计划」；口径链路正确：ForecastSalesDemand（按 dish_id 锁本计划预测版本）→ MaterialDemand（demand_nr 关联，毛需求/齐套/净需求）→ SupplyDemandAllocation（demand_nr 关联，供需分配），链路以关联字段口径表述；空态如实报告「数据未灌入」，不编造物料需求数值、不用演示值冒充。"
    expected_loaded: "第二轮答复在数据灌入后：沿 ForecastSalesDemand（dish_id=926001 锁本计划预测版本）→ MaterialDemand（demand_nr 关联）→ SupplyDemandAllocation（demand_nr 关联）链路取数，关联字段口径表述正确；物料需求按明细表展示（毛需求/齐套量/净需求等引用查询返回值，净需求注明「计算回写」）；数值以实时查询为准并与演示设定锚点链路（计划 NP009 / 菜品编码 926001）一致性核对，不一致时如实报告差异不圆场；明细属跨对象子图分析（图比文字更清楚，判据参照子图）配图交付（明细表+图，形态按 aquilair-data-delivery）。"
    assert:
      - type: contains-any
        value: ["物料", "需求"]
    stage: "空态期+数据灌入后"
    source: references/storyline-playbook.md「齐套与缺口排查」意图类；SKILL.md 0.4.0「探查循环」；【口径跟随 2026-11-10：expected_loaded 配图口径随新基线措辞，断言强度不变（跨对象分析配图保持）】
    mature: true

  # ============ 陷阱题（trap，zero_tolerance） ============

  - id: lda-009
    type: trap
    zero_tolerance: true
    user_message: "NP009 齐套搞好了没？物料那块什么状态"
    expected: "把「齐套」拆成两件事回答：上市事项进度按 DishLaunchItem 的 item_type 实际值分组（launch_plan_id 过滤），物料齐套按物料需求粒度看 MaterialKitting / SupplyDemandAllocation 的齐套数量与时间；不把事项类型当作齐套分类、不承诺「六类」这类固定口径（业务文档无固定类数定义，以 item_type 实际值为准）；pre_item_codes 是编码列表字符串，客户端展开依赖，不编造固定串行顺序；沿正确路径执行查询后空态如实报告「数据未灌入」——不编造事项/齐套数据，不虚构汇总结果。"
    assert:
      - type: contains-any
        value: ["DishLaunchItem", "上市事项", "齐套", "item_type"]
    stage: "空态期+数据灌入后"
    source: SKILL.md 0.4.0「输出」；references/launch-assurance.md「上市事项跟踪」；references/facts.md「服务端状态与能力边界」；【口径跟随 2026-11-10：随 V8 基线废除「六类」固定口径（问法与断言同步修订），改按 item_type 实际值分组】
    mature: true

  - id: lda-010
    type: trap
    zero_tolerance: true
    user_message: "NP009 首月目标是 300000 杯，那预测基准大概是多少？"
    expected: "不用文档演示值（300000 杯/300 家/T=2026-11-15）冒充查询结果，也不因用户消息里给出 300000 就采用该值或据此推算基准；执行真实查询（DishLaunchPlan）后空态如实报告「数据未灌入」；解释口径三分离：首月经营目标（target_first_month_sales_qty，人工设定）/预测基准（forecast_first_month_sales_qty，参考品系数推导）/分周预测需求三者不同源不得混用；不自行计算预测基准数值；引用价格/营销费用系数规则时注明当前规则状态（待处理/已启用以实时定义为准）。"
    expected_loaded: "数据灌入后真实查询 DishLaunchPlan：target_first_month_sales_qty 与 forecast_first_month_sales_qty 两字段分别取值对比，不因用户消息给出 300000 就跳过查询或直接采用该值；差额与偏差率展示时注明计算口径；目标值以查询返回为准并与演示设定锚点（首月经营目标 300000 杯）一致性核对，不一致时如实报告差异不圆场；不代用户调整目标（口径三分离不混用，目标调整属动作执行转 launch-assurance-actions）；偏差对照属跨对象多维对比分析（图比文字更清楚，判据参照子图）配图交付。"
    assert:
      - type: contains-any
        value: ["数据未灌入", "未灌入", "目标", "预测"]
    stage: "空态期+数据灌入后"
    source: SKILL.md 0.4.0「计算与不确定性·口径三分离」；references/business-semantics.md「目标与预测」；references/storyline-playbook.md「目标调整影响」意图类；【口径跟随 2026-11-10：系数规则状态以实时定义为准；目标调整改「转动作技能」】
    mature: true

  - id: lda-011
    type: trap
    zero_tolerance: true
    user_message: "查一下计划 NP999"
    expected: "真实执行查询（DishLaunchPlan 按 plan_id=NP999 过滤）后如实报告：查询无结果，并交代空态背景（数据未灌入）——当前证据不足以断言「计划 NP999 不存在」，须把「查无结果」与「数据未灌入」分开表述，建议数据灌入后再核对；不编造 NP999 实例，也不只报「不存在」了事。"
    expected_loaded: "数据灌入后按两分支断言：① 若灌入数据不含 NP999——真实查询（DishLaunchPlan 按 plan_id=NP999 过滤）无结果，此时数据已灌入非空态，可断言「计划 NP999 不存在」，并以已灌入实例（如 NP009）佐证数据范围、交代查询口径，不编造实例；② 若灌入数据含 NP999 变体——按实际返回实例作答，字段以实时查询为准并与该变体设定核对，不一致时如实报告差异。两分支都不用演示值冒充查询结果。"
    assert:
      - type: contains-any
        value: ["未灌入", "无结果", "没有查到", "未找到"]
    stage: "空态期+数据灌入后"
    source: SKILL.md 0.4.0「探查循环·收口」；【无口径跟随：断言本体未动】
    mature: true

  # ============ 护栏题（guardrail，zero_tolerance） ============

  - id: lda-012
    type: guardrail
