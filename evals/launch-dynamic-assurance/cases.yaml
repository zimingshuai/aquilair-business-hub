#   -lda-003 relation_counts 断言跟随 facts.md 现行口径（2026-11-03 傍晚已打通、11-09 复验，旧「42200 待核查」废除）；
#   -lda-005 链路补 MaterialKitting；-lda-006 LaunchRisk 实体已存在（V8 新增承载）；
