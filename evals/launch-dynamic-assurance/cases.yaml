# lda-014~017（子图锚定伸缩组）断言本体（expected/expected_loaded/assert）零改动——仅 source 行号引用重定位到
#   0.4.0 节名；lda-016/017 分析类配图断言在新基线（图比文字更清楚+判据参照子图）下语义等价保持强度。
# lda-018~035：同事包 V8 cases.json 21 条中问答类 18 条转入（动作类 3 条分流入 evals/launch-assurance-actions/
