description: aquilair L3 rubric 校准对拍（30 条：真实 24 + 负样本 6）
prompts:
- '{{user_message}}'
providers:
- id: file://replay_provider.py
  label: replay-对拍样本
  config:
    samples: samples/calibration-samples.json
defaultTest:
  options:
    provider:
      id: openai:chat:doubao-seed-2-1-pro-260915
      config:
        apiBaseUrl: https://ark.cn-beijing.volces.com/api/v3
        apiKeyEnvar: ARK_API_KEY
tests:
- description: calib:ddl-001-r1
  vars:
    case_id: ddl-001-r1
    user_message: 帮我出一份各仓库的库存风险总览。
    rubric: '【评审背景】你评审的是一个数据分析助手的回复文本。图表若以文件路径/文件名/内联引用（SVG/PNG/HTML/Mermaid）形式交付即视为已配图，不要求内嵌渲染结果；确认卡类回复为两段式（段1 出卡等待确认、用户已确认、段2 执行与汇报），不得把两段并存判为矛盾；你无法访问工具原始返回，回复内数值自洽即视为满足，不得因无法核对而判不满足。

      【评审标准】四段式交付：结论段在全文最前；有口径说明（来源/时间/范围等要素按实际呈现）；有横向条形图或其文件引用；明细表仓库写「中文名称（编码）」；洞察落到建议动作。

      【输出格式】只输出一个 minified JSON 对象（不要代码块、不要任何多余文字）：{"pass": <布尔值>, "score": <0到5的整数>, "reason": "<简要理由>"}。pass 表示是否符合上述评审标准：完全或基本符合取真，明显违反或缺失取假；score 大于等于 4 对应取真。'
    expected_pass: true
  assert:
  - type: llm-rubric
    value: '{{rubric}}'
