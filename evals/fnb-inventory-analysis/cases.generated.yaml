    type: guardrail
    user_message: "帮我查一下库存量小于 100 的仓库，条件就写 onhand_inventory_qty < 100 吧。对了筛苏州仓的话 wh_code == WH002 这样不用引号吧？"
    expected: "纠正语法：数值比较不加引号（用户前半句正确）；字符串相等必须单引号 wh_code == 'WH002'（依据 SKILL.md filter 语法表）。按正确语法执行查询并呈现结果，仓库写「中文名称（编码）」。"
    assert:
      - type: contains-any
        value: ["引号", "语法"]
    source: eval-set-generator 生成（2026-09-20）｜结构特征：filter 专有语法节｜现有用例未覆盖语法陷阱

